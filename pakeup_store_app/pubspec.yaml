name: pakeup_store_app
description: "PakeUp partner store app for salon & beauty partners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  intl: ^0.19.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
